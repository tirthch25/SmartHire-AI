name: Deploy SmartHire to Vercel

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "vercel.json"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  migrate-and-deploy:
    name: Migrate Supabase and deploy Vercel services
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install sqlalchemy==2.0.36 asyncpg==0.30.0 alembic==1.14.0 \
            pydantic==2.10.3 pydantic-settings==2.6.1 python-dotenv==1.0.1 structlog==24.4.0

      - name: Apply database migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Settings validates this during Alembic startup; migrations do not use JWT signing.
          SECRET_KEY: migration-only-placeholder-key-32-characters-minimum
          APP_ENV: production
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          GEMINI_API_KEY: migration-placeholder
          BLOB_READ_WRITE_TOKEN: migration-placeholder
        run: alembic upgrade head

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy project to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
