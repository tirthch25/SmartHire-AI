# =============================================================================
# render.yaml — SmartHire AI Backend Services
# =============================================================================
# Deploy to Render by connecting your GitHub repo at https://render.com/
# Render will auto-detect this file and provision all services below.
# Set all environment variable values manually in the Render dashboard.
# =============================================================================

services:
  # ── FastAPI API Server ──────────────────────────────────────────────────────
  - type: web
    name: smarthire-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free                   # upgrade to starter ($7/mo) for persistent disks
    region: oregon               # choose: oregon | frankfurt | singapore | ohio
    branch: main
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: SmartHire AI
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: WARNING

      # ── Security ─────────────────────────────────────────────────────────
      - key: SECRET_KEY
        sync: false              # set manually in Render dashboard
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: ALLOWED_ORIGINS
        sync: false              # set to your Vercel URL, e.g. https://smarthire.vercel.app

      # ── Database (Neon PostgreSQL) ────────────────────────────────────────
      - key: DATABASE_URL
        sync: false              # postgresql+asyncpg://user:pass@ep-xxx.neon.tech/smarthire_db?sslmode=require

      # ── Redis (Upstash) ───────────────────────────────────────────────────
      - key: REDIS_URL
        sync: false              # rediss://:password@host:port
      - key: CACHE_TTL_SECONDS
        value: 300

      # ── Celery ───────────────────────────────────────────────────────────
      - key: CELERY_BROKER_URL
        sync: false              # same as REDIS_URL (db index 1)
      - key: CELERY_RESULT_BACKEND
        sync: false              # same as REDIS_URL (db index 2)
      - key: CELERY_CONCURRENCY
        value: 2
      - key: CELERY_TASK_SOFT_TIME_LIMIT
        value: 120
      - key: CELERY_TASK_TIME_LIMIT
        value: 180

      # ── Cloudflare R2 (Free S3-Compatible Storage) ─────────────────────
      - key: STORAGE_ENDPOINT_URL
        sync: false              # https://<account_id>.r2.cloudflarestorage.com
      - key: AWS_ACCESS_KEY_ID
        sync: false              # R2 API token Access Key ID
      - key: AWS_SECRET_ACCESS_KEY
        sync: false              # R2 API token Secret
      - key: AWS_REGION
        value: auto
      - key: AWS_S3_BUCKET_NAME
        sync: false
      - key: S3_PRESIGNED_URL_EXPIRY
        value: 3600

      # ── Google Gemini AI ──────────────────────────────────────────────────
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash

      # ── SentenceTransformers ──────────────────────────────────────────────
      - key: SENTENCE_TRANSFORMER_MODEL
        value: all-MiniLM-L6-v2

      # ── ChromaDB (in-memory for free tier; upgrade for persistent disk) ───
      - key: CHROMA_HOST
        value: localhost
      - key: CHROMA_PORT
        value: 8001

      # ── Rate Limiting ─────────────────────────────────────────────────────
      - key: RATE_LIMIT_DEFAULT
        value: 60/minute
      - key: RATE_LIMIT_AUTH
        value: 10/minute
      - key: RATE_LIMIT_UPLOAD
        value: 5/minute

  # ── Celery Worker ────────────────────────────────────────────────────────────
  - type: worker
    name: smarthire-celery
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    branch: main
    startCommand: >
      celery -A app.workers.celery_app worker
      --loglevel=warning
      --concurrency=2
      --queues=resume,ats,ai,export,default
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: auto
      - key: AWS_S3_BUCKET_NAME
        sync: false
      - key: SENTENCE_TRANSFORMER_MODEL
        value: all-MiniLM-L6-v2
      - key: CHROMA_HOST
        value: localhost
      - key: CHROMA_PORT
        value: 8001
